<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F25A1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Němčina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Deutsch jeden Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: jednoobrazovková mobilní appka jako tréninkový deník — domů (série, denní kruh, START, cesta), trénink (cvičení + spodní akční lišta), výsledek */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#10202A; --muted:#5E6E76; --line:#DCE2DB;
  --accent:#F25A1D; --accent-ink:#FFFFFF; --good:#1E9A57; --bad:#D63A36; --gold:#E9A800;
  --good-bg:#E3F4EA; --bad-bg:#FBE6E4; --chip:#E8ECE6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D151A; --surface:#16212A; --ink:#E7EDEF; --muted:#8FA0A8; --line:#26343D;
  --accent:#FF6A33; --accent-ink:#140B06; --good:#3CC07A; --bad:#F15C57; --gold:#F5C232;
  --good-bg:#12301F; --bad-bg:#3A1717; --chip:#1E2B34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151A; --surface:#16212A; --ink:#E7EDEF; --muted:#8FA0A8; --line:#26343D;
  --accent:#FF6A33; --accent-ink:#140B06; --good:#3CC07A; --bad:#F15C57; --gold:#F5C232;
  --good-bg:#12301F; --bad-bg:#3A1717; --chip:#1E2B34; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:560px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}

/* tlačítka s „hloubkou" */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.btn:disabled{background:var(--chip);color:var(--muted);box-shadow:0 4px 0 var(--line);transform:none;cursor:default}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000);color:#fff}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.link{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:8px;text-decoration:underline;text-underline-offset:3px}

/* ---------- DOMŮ ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 4px}
.brand{font:800 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.brand b{color:var(--accent)}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding-block:14px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .num b{font:800 40px/1 var(--display)}
.ring .num span{font-size:13px;color:var(--muted);font-weight:600}
.streak{display:flex;flex-direction:column;gap:8px;min-width:0}
.streakNum{display:flex;align-items:baseline;gap:8px}
.streakNum b{font:800 54px/.9 var(--display);font-variant-numeric:tabular-nums}
.streakNum span{font-weight:700;color:var(--muted);line-height:1.1}
.streakNum.on b{color:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:240px}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.week i{width:100%;aspect-ratio:1;max-width:30px;border-radius:50%;background:var(--chip);display:block;border:2px solid transparent}
.week i.part{background:color-mix(in srgb,var(--gold) 35%,var(--chip))}
.week i.on{background:var(--gold)}
.week i.today{border-color:var(--ink)}
.startWrap{display:flex;flex-direction:column;gap:10px;padding-block:6px 18px}
.status{font-size:15px;text-align:center;color:var(--muted);font-weight:600;min-height:21px}
.lessonCard{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lessonCard h2{font-size:24px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--bg);border-radius:10px;padding:10px 12px}
.tip b{color:var(--accent);font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.path{display:flex;flex-direction:column;gap:14px;padding-block:18px 28px}
.unit{display:flex;flex-direction:column;gap:8px}
.unitHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.unitHead h2{font-size:21px}
.unitHead span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.lessons{display:flex;flex-wrap:wrap;gap:6px}
.lessons span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.lessons span.done{background:var(--good-bg);color:var(--good)}
.lessons span.cur{background:var(--accent);color:var(--accent-ink)}
.note{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.note ol{margin:0;padding-left:20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-block:4px 20px;font-size:13px;color:var(--muted)}

/* ---------- TRÉNINK ---------- */
.sesTop{display:flex;align-items:center;gap:12px;padding-block:12px}
.close{background:none;border:0;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.close svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.mins{font:700 16px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted);min-width:44px;text-align:right}
.ex{display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.kind{font:800 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:.02em}
.kind.new{color:var(--accent)}
.prompt{font-size:22px;font-weight:600;line-height:1.3}
.sayRow{display:flex;align-items:center;gap:12px}
.speak{flex:none;width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 70%,#000)}
.speak svg{width:26px;height:26px}
.speak.big{width:96px;height:96px;border-radius:24px;margin:8px auto}
.speak.big svg{width:46px;height:46px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.arts .opt{text-align:center;font:800 26px/1 var(--display);padding:20px 4px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.card .de{font:800 36px/1.05 var(--display);overflow-wrap:anywhere}
.card .de.long{font-size:26px;line-height:1.15}
.mc .prompt{font-size:20px}
.unitRow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.unitRow .bar{grid-column:1 / -1;height:6px}
.unitRow b{font-weight:600;font-size:15px;min-width:0}
.unitRow span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.unitRow.done b{color:var(--good)}
.more{align-self:flex-start}
.card .pl{font-size:15px;color:var(--muted)}
.card .cz{font-size:21px;font-weight:700}
.card .exDe{font-size:18px;font-weight:600;border-top:2px solid var(--line);padding-top:10px}
.card .exCz{font-size:16px;color:var(--muted)}
.answerLine{min-height:118px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-block:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-block:6px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 13px;font-size:18px;font-weight:600}
.tile.used{visibility:hidden}
.typebox{width:100%;min-height:56px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:20px;resize:none}
textarea.typebox{min-height:110px}
.typebox:focus{border-color:var(--accent);outline:none}
.keys{display:flex;gap:8px}
.keys button{flex:1;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:8px 0;font-size:19px;font-weight:700}
.hint{font-size:14px;color:var(--muted)}
.action{border-top:2px solid var(--line);background:var(--bg);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.action .pad{display:flex;flex-direction:column;gap:10px;padding-block:14px 0}
.action.ok{background:var(--good-bg);border-top-color:var(--good-bg)}
.action.ko{background:var(--bad-bg);border-top-color:var(--bad-bg)}
.fb{display:flex;flex-direction:column;gap:4px}
.fb h3{margin:0;font:800 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.action.ok .fb h3{color:var(--good)}
.action.ko .fb h3{color:var(--bad)}
.fb .ans{font-size:18px;font-weight:600}
.fb .why{font-size:15px;color:var(--muted)}
.thinking{font-size:16px;color:var(--muted);font-weight:600}

/* ---------- VÝSLEDEK ---------- */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px;text-align:center}
.result h1{font-size:42px;line-height:1}
.result h1.gold{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:600}

.inst{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:28px 24px}
.inst h1{font-size:34px;line-height:1.05}
.inst .big{font-size:18px}
.appIcon{width:88px;height:88px;border-radius:22px;background:#F25A1D;color:#fff;display:grid;place-items:center;font:800 40px/1 var(--display);box-shadow:0 6px 0 color-mix(in srgb,#F25A1D 70%,#000)}
.stepsI{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.stepsI li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;font-size:18px;line-height:1.35}
.stepsI li > i{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 22px/1 var(--display)}
.kbd{display:inline-block;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:1px 8px;font-weight:700;white-space:nowrap}
.mock{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
.mock div{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.mock div.hl{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--ink);font-weight:700;border-left:5px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.btn:active,.speak:active{transform:none}}
</style>

</head>

const GOAL = 600; // sekund = 10 min
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rnd(a.length)];

function dayKey(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(d){ d = d || new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }

/* položky */
let ITEMS = {}, LESSONS = [];
function buildIndex(){
  ITEMS = {}; LESSONS = [];
  const extra = S.extra && S.extra.length ? [{t:"Bonus od Clauda", lessons:S.extra.map((l, li) => ({t:l.t, tip:l.tip, items:l.items.map((it, ii) => ["x"+li+"i"+ii].concat(it))}))}] : [];
  const units = COURSE.concat(extra);
  units.forEach((u, ui) => u.lessons.forEach((l) => {
    const ids = [];
    l.items.forEach(it => {
      const [id, de, cz] = it;
      let exDe = it[3] || "", exCz = it[4] || "";
      const words = de.split(/\s+/).length;
      const sent = words >= 3 || /[.?!…]$/.test(de);
      if (!exDe && words >= 2) { exDe = de; exCz = cz; }
      const hasEx = exDe.split(/\s+/).length >= 2;
      ITEMS[id] = {id, de, cz, exDe, exCz, pl:it[5]||"", unit:ui, sent, hasEx, noun:/^(der|die|das) \S+$/.test(de)};
      ids.push(id);
    });
    LESSONS.push({unit:ui, unitT:u.t, t:l.t, tip:l.tip||"", ids});
  }));
  UNITS_ALL = units;
}
let UNITS_ALL = COURSE;

/* ================= STAV + UKLÁDÁNÍ ================= */
const LS = "deutsch-jeden-tag-v1";
let S = {v:2, days:{}, cards:{}, extra:[], xp:0, updated:0};
let doc = null, syncState = "local", saveT = null, chain = Promise.resolve();
function norm(o){
  return {v:Number(o&&o.v)||1, days:(o&&o.days&&typeof o.days==="object")?o.days:{}, cards:(o&&o.cards&&typeof o.cards==="object")?o.cards:{},
    extra:Array.isArray(o&&o.extra)?o.extra:[], xp:Number(o&&o.xp)||0, updated:Number(o&&o.updated)||0};
}
function lsRead(){ try{ const t = localStorage.getItem(LS); return t ? norm(JSON.parse(t)) : null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function pref(k, v){ try{ if (v === undefined) return localStorage.getItem(LS+"-"+k); localStorage.setItem(LS+"-"+k, v); }catch(e){ return null; } }
function payload(){ const t = dayKey(); return JSON.parse(JSON.stringify(Object.assign({}, S, {today:t, todaySeconds:Math.round(S.days[t]||0), goalSeconds:GOAL, goalMetToday:(S.days[t]||0)>=GOAL, streak:streak()}))); }
function flush(){
  if (!doc) return;
  const data = payload();
  chain = chain.then(() => doc.set(data)).then(() => { syncState = "cloud"; }).catch(() => { syncState = "error"; });
}
function save(now){
  S.updated = Date.now(); lsWrite();
  clearTimeout(saveT);
  if (now) flush(); else saveT = setTimeout(flush, 1500);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(saveT); flush(); } });

/* ================= STATISTIKY ================= */
function secToday(){ return S.days[dayKey()] || 0; }
function streak(){
  const d = new Date(); let n = 0;
  if ((S.days[dayKey(d)]||0) < GOAL) d.setDate(d.getDate()-1);
  while ((S.days[dayKey(d)]||0) >= GOAL) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ================= INTERVALOVÉ OPAKOVÁNÍ ================= */
/* karta: [due (den), interval (dny), ease*10, chyby, opakování] */
function srs(id, ok){
  const t = dayNum(); const c = S.cards[id] || [t,0,25,0,0];
  let [due, ivl, ease, lapses, reps] = c;
  if (ok) {
    ivl = ivl < 1 ? 1 : ivl < 2 ? 3 : Math.max(ivl+1, Math.round(ivl * ease / 10));
    ease = Math.min(30, ease + 1); reps++;
  } else {
    lapses++; ease = Math.max(13, ease - 2); ivl = 0;
  }
  S.cards[id] = [t + Math.max(1, ivl), ivl, ease, lapses, reps];
}

let ses = null;
function typesFor(id, review){
  const it = ITEMS[id], c = S.cards[id], ivl = c ? c[1] : 0;
  const listen = soundOn && ttsOk() && !(ses && ses.noListen);
  let t;
  if (it.sent) {
    // celé věty: význam, skládání, poslech
    if (!review || ivl <= 1) t = ["mc_cz","mc_de","build", listen ? "listen_mc" : "mc_cz"];
    else t = ["build","build", listen ? "listen" : "build", "mc_de"];
  } else if (!review || ivl <= 1) t = ["mc_de","mc_cz","mc_de", it.noun ? "article" : "mc_cz", listen ? "listen_mc" : "mc_de"];
  else if (ivl <= 7) t = [it.hasEx ? "build" : "type","type","mc_de", it.noun ? "article" : "type", listen && it.hasEx ? "listen" : "type"];
  else t = ["type","type", it.hasEx ? "build" : "type", listen && it.hasEx ? "listen" : "type"];
  return pick(t);
}
function nextNew(n){
  const out = [];
  for (const l of LESSONS) { for (const id of l.ids) { if (!S.cards[id]) { out.push(id); if (out.length >= n) return out; } } }
  return out;
}
function startSession(){
  buildIndex();
  const due = dueIds().slice(0, 10);
  const fresh = nextNew(5);
  const steps = [];
  const rev = shuffle(due.map(id => ({type:typesFor(id,true), id, review:true})));
  steps.push(...rev.slice(0, 4));
  fresh.forEach(id => { steps.push({type:"intro", id}); steps.push({type:"mc_cz", id, fresh:true}); });
  steps.push(...rev.slice(4));
  shuffle(fresh.slice()).forEach(id => { const it = ITEMS[id];
    steps.push({type: pick(it.sent ? ["build","mc_de"] : it.noun ? ["article","mc_de","type"] : it.hasEx ? ["mc_de","build","type"] : ["mc_de","type"]), id, fresh:true}); });
  // když je málo práce, procvič nejslabší slova
  if (steps.length < 10) {
    const known = Object.keys(S.cards).filter(id => ITEMS[id] && !due.includes(id) && !fresh.includes(id));
    known.sort((a,b) => (S.cards[b][3]-S.cards[a][3]) || (S.cards[a][1]-S.cards[b][1]));
    known.slice(0, 12 - steps.length).forEach(id => steps.push({type:typesFor(id,true), id, practice:true}));
  }
  // věta pro Clauda
  const pool = Object.keys(S.cards).filter(id => ITEMS[id] && S.cards[id][4] >= 1 && ITEMS[id].exDe.split(/\s+/).length >= 3 && ITEMS[id].exCz);
  if (pool.length >= 4) steps.push({type: "ai", id: pick(pool), practice:true});
  if (!steps.length) { toast("Zatím tu nic není."); return; }
  ses = {steps, i:0, graded:new Set(), right:0, wrong:0, xp:0, last:Date.now(), startSec:secToday(), noListen:false};
  renderStep();
}
function tick(){
  const now = Date.now(); const dt = Math.min(now - ses.last, 40000); ses.last = now;
  const k = dayKey(); S.days[k] = (S.days[k]||0) + dt/1000;
}

  const step = ses.steps[ses.i];

  app.innerHTML = "";

  if (step.type === "intro") {

    btn.onclick = () => {

    };

  }
  btn.onclick = async () => {
    btn.disabled = true;

    if (r.selfGrade) {

      r = {ok: choice, correct: r.correct, show: false};
    }
    tick();

    save();
    // zpětná vazba
    act.className = "action " + (ok ? "ok" : "ko");
    ap.innerHTML = "";
    const fb = el("div","fb");
    fb.append(el("h3", null, ok ? (r.note ? "Skoro!" : pick(["Správně!","Výborně!","Přesně tak!","Super!"])) : "Špatně"));
    if (!ok || r.note || r.show) fb.append(el("div","ans", (ok ? "" : "Správně: ") + (r.correct || "")));
    if (r.note) fb.append(el("div","why", r.note));
    if (r.cz) fb.append(el("div","why", r.cz));
    ap.append(fb);
    const nb = el("button","btn " + (ok ? "good" : "bad"), "Pokračovat");
    nb.onclick = () => { ses.i++; renderStep(); };
    ap.append(nb); nb.focus();
    if (r.speak) say(r.speak);

}

/* ---------- pomocníci cvičení ---------- */
function normTxt(s){
  return String(s).toLowerCase().replace(/[.,!?;:"„“”'’«»…–—()-]/g," ")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/\s+/g," ").trim();
}
function lev(a, b){
  const m = a.length, n = b.length; if (Math.abs(m-n) > 2) return 3;
  const d = Array.from({length:m+1}, (_, i) => [i]); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function distract(it, field, n){
  const all = Object.values(ITEMS).filter(o => o.id !== it.id && o[field] !== it[field]);
  const kind = o => o.sent === it.sent && o.noun === it.noun;
  const same = shuffle(all.filter(o => o.unit === it.unit && kind(o)))
    .concat(shuffle(all.filter(o => o.unit !== it.unit && kind(o) && Math.abs(o.unit - it.unit) <= 3)));
  const other = shuffle(all.filter(o => !kind(o) && o.unit === it.unit)).concat(shuffle(all.filter(o => kind(o))).slice(0, 40));
  const out = []; const seen = new Set([normTxt(it[field])]);
  for (const o of same.concat(other)) { const k = normTxt(o[field]); if (!seen.has(k)) { seen.add(k); out.push(o[field]); } if (out.length >= n) break; }
  return out;
}

    body.append(el("div","prompt", noun + "  ·  " + it.cz));
    const box = el("div","arts"); let sel = null; const btns = {};
    ["der","die","das"].forEach(a => { const b = el("button","opt", a); b.setAttribute("aria-pressed","false"); btns[a] = b;
      b.onclick = () => { Object.values(btns).forEach(x => x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel = a; ready(true); }; box.append(b); });
    body.append(box);
    return {check(){ const ok = sel === art; btns[art].classList.add("right"); if (!ok && sel) btns[sel].classList.add("wrong");
      return {ok, correct:it.de + (it.pl ? "  (mn. č. " + it.pl + ")" : ""), show:true, speak:it.de}; }};
  },
  build(step, it, body, ready){
    kindLabel(body, "Přelož větu");
    body.append(el("div","prompt", it.exCz));
    const toks = sentenceTokens(it.exDe);
    const extra = distract(it,"exDe",6).flatMap(sentenceTokens).filter(t => !toks.some(x => normTxt(x) === normTxt(t)));
    const get = tilesUI(body, toks, shuffle([...new Set(extra)]).slice(0, Math.min(4, Math.max(2, Math.ceil(toks.length/2)))), ready);
    return {check(){ const ok = normTxt(get()) === normTxt(it.exDe); return {ok, correct:it.exDe, show:true, speak:it.exDe}; }};
  },
  listen(step, it, body, ready){
    kindLabel(body, "Poslouchej a slož větu");
    const row = el("div","sayRow"); row.append(speakBtn(it.exDe, true)); body.append(row); say(it.exDe);
    const toks = sentenceTokens(it.exDe);
    const extra = distract(it,"exDe",6).flatMap(sentenceTokens).filter(t => !toks.some(x => normTxt(x) === normTxt(t)));
    const get = tilesUI(body, toks, shuffle([...new Set(extra)]).slice(0, 3), ready);
    addNoListen(body);
    return {check(){ const ok = normTxt(get()) === normTxt(it.exDe); return {ok, correct:it.exDe, cz:it.exCz, show:true}; }};
  },
  type(step, it, body, ready, submit){
    kindLabel(body, "Napiš německy");
    body.append(el("div","prompt", it.cz));
    if (it.noun) body.append(el("div","hint","i se členem der / die / das"));
    const get = typeUI(body, false, ready, submit);
    return {check(){
      const a = normTxt(get()), c = normTxt(it.de);
      if (a === c) return {ok:true, correct:it.de, speak:it.de, cz:it.exDe};
      if (it.noun) {
        const noun = c.split(" ").slice(1).join(" ");
        if (a === noun) return {ok:false, correct:it.de, note:"Chybí člen. Podstatné jméno se učí vždy se členem."};
        const aw = a.split(" ");
        if (aw.length >= 2 && aw.slice(1).join(" ") === noun) return {ok:false, correct:it.de, note:"Špatný člen."};
      }
      if (c.length >= 5 && lev(a, c) === 1) return {ok:true, correct:it.de, note:"Máš tam překlep.", speak:it.de};
      return {ok:false, correct:it.de, cz:it.exDe, speak:it.de};
    }};
  },
  ai(step, it, body, ready, submit){
    kindLabel(body, "Přelož celou větu");
    body.append(el("div","prompt", it.exCz));
    body.append(el("div","hint", sample ? "Piš vlastními slovy. Kontroluje Claude, takže projde i jiná správná varianta." : "Napiš celou větu. Pak ji porovnáš se vzorem a sám ohodnotíš."));
    const get = typeUI(body, true, ready, submit);
    return {async check(){
      const ans = get().trim();
      if (normTxt(ans) === normTxt(it.exDe)) return {ok:true, correct:it.exDe, speak:it.exDe};
      if (!sample) {
        if (lev(normTxt(ans), normTxt(it.exDe)) <= 1) return {ok:true, correct:it.exDe, note: normTxt(ans) === normTxt(it.exDe) ? "" : "Máš tam překlep.", speak:it.exDe};
        return {selfGrade:true, correct:it.exDe, yours:ans, speak:it.exDe};
      }
      const wait = el("div","thinking","Claude kontroluje…"); body.append(wait);
      try{
        const r = await sample.json(
`Jsi učitel němčiny. Student (Čech, úroveň A1–A2) překládal českou větu do němčiny.
Česká věta: "${it.exCz}"
Vzorový překlad: "${it.exDe}"
Odpověď studenta: "${ans.slice(0,300)}"
Posuď, jestli je odpověď správná německá věta se stejným významem. Jiný slovosled nebo synonymum je v pořádku, pokud je gramaticky správně. Drobný překlep nebo chybějící přehláska = správně, ale zmiň ho.
Odpověz POUZE JSON: {"ok": true/false, "oprava": "správná verze věty (nejbližší studentově odpovědi)", "proc": "jedna krátká věta česky, co bylo špatně, nebo prázdný řetězec"}`,
          {modelTier:"quick", cache:false});
        wait.remove();
        return {ok: !!(r && r.ok), correct: (r && r.oprava) || it.exDe, note: (r && r.proc) || "", speak: (r && r.oprava) || it.exDe, show:true};
      }catch(e){
        wait.remove();
        const ok = lev(normTxt(ans), normTxt(it.exDe)) <= 2;
        return {ok, correct:it.exDe, note:"Claude teď nemohl odpověď zkontrolovat, porovnáno se vzorem.", speak:it.exDe, show:true};
      }
    }};
  }
};
function addNoListen(body){
  const b = el("button","link","Teď nemůžu poslouchat");
  b.onclick = () => {
    ses.noListen = true;
    ses.steps.forEach((s, i) => { if (i >= ses.i && (s.type === "listen" || s.type === "listen_mc")) s.type = s.type === "listen" ? "build" : "mc_de"; });
    renderStep();
  };
  body.append(b);
}

/* ================= VÝSLEDEK ================= */
function renderResult(){
  tick(); save(true);
  const sec = secToday(), met = sec >= GOAL, justMet = met && ses.startSec < GOAL, st = streak();
  app.innerHTML = "";
  const p = el("div","pad result"); app.append(p);
  if (justMet) {
    p.append(el("span","label","Dnešní cíl splněný"));
    const h = el("h1","gold", `Série ${st} ${st===1?"den":st<=4?"dny":"dní"}`); p.append(h);
    p.append(el("div","muted","Dnešek je odškrtnutý. Zítra zase."));
    buzz([60,40,120]);
  } else {
    p.append(el("span","label","Kolo hotové"));
    p.append(el("h1",null, met ? "Bonus navíc" : "Dobrá práce"));
    p.append(el("div","muted", met ? "Cíl už máš, tohle je navíc." : `Do denního cíle zbývá ${Math.max(1, Math.ceil((GOAL-sec)/60))} min. Dej ještě jedno kolo.`));
  }
  const total = ses.right + ses.wrong;
  const stats = el("div","stats");
  [[`+${ses.xp}`,"XP"],[total ? Math.round(ses.right/total*100)+" %" : "–","přesnost"],[Math.floor(sec/60)+"/10","minut dnes"]].forEach(([b, s]) => {
    const d = el("div","stat"); d.append(el("b",null,b)); d.append(el("span",null,s)); stats.append(d);
  });
  p.append(stats);
  const btns = el("div"); btns.style.display = "flex"; btns.style.flexDirection = "column"; btns.style.gap = "12px";
  const again = el("button","btn", met ? "Ještě kolo" : "Další kolo"); again.onclick = startSession;
  const home = el("button","btn ghost","Domů"); home.onclick = renderHome;
  btns.append(again, home); p.append(btns);
  ses = null;
}

/* ================= LEKCE OD CLAUDA ================= */
const TOPICS = ["e-mail zákazníkovi","jednání s obcí o hřišti","veřejná zakázka a termíny","doprava a vykládka zboží","bezpečnostní kontrola branek","umělý trávník a údržba","oplocení hřiště","trénink dětí U8","běh a sport","počasí a víkend","hotel a cesta autem","porada v kanceláři"];
async function genLesson(btn){
  if (!sample) { toast("Claude teď není dostupný. Otevři appku přihlášený v Claude."); return; }
  btn.disabled = true; btn.textContent = "Claude tvoří lekci…";
  const used = new Set(Object.values(ITEMS).map(o => normTxt(o.de)));
  const topic = TOPICS[S.extra.length % TOPICS.length];
  try{
    const arr = await sample.json(
`Vytvoř lekci němčiny pro Čecha (A1–A2), který prodává sportovní vybavení (branky, sítě, hřiště, oplocení) a trénuje fotbal dětí. Téma: ${topic}.
Dej 6 praktických slov nebo krátkých frází, které NEJSOU v tomto seznamu: ${[...used].slice(0,200).join(", ")}.
Podstatná jména vždy se členem (der/die/das) a s množným číslem. Věty krátké (3–7 slov), přirozené, správná gramatika.
Odpověz POUZE JSON: {"nazev":"krátký název lekce česky","tip":"jedno gramatické pravidlo česky s příkladem","polozky":[{"de":"der Rasen","cz":"trávník","veta_de":"Der Rasen ist nass.","veta_cz":"Trávník je mokrý.","pl":"die Rasen"}]}`,
      {modelTier:"default", cache:false});
    const items = (arr && Array.isArray(arr.polozky) ? arr.polozky : []).filter(o => o && o.de && o.cz && o.veta_de && o.veta_cz).slice(0,6)
      .map(o => [String(o.de), String(o.cz), String(o.veta_de), String(o.veta_cz), String(o.pl||"")]);
    if (items.length < 4) throw 0;
    S.extra.push({t:String(arr.nazev||topic).slice(0,40), tip:String(arr.tip||""), items});
    save(true); toast("Nová lekce je připravená.");
  }catch(e){ toast("Lekci se nepodařilo vytvořit. Zkus to znovu."); }
  renderHome();
}

function isStandalone(){ try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; } }
function isPhone(){ return /Android|iPhone|iPad/i.test(navigator.userAgent); }
function browserKind(){
  const ua = navigator.userAgent;
  if (/SamsungBrowser/i.test(ua)) return "samsung";
  if (/; wv\)|FBAN|FBAV|Instagram|Line\/|Claude/i.test(ua)) return "inapp";
  if (/Firefox|FxiOS|OPR|EdgA|YaBrowser|MiuiBrowser|HuaweiBrowser/i.test(ua)) return "other";
  if (/iPhone|iPad/i.test(ua)) return "ios";
  if (/Chrome/i.test(ua)) return "chrome";
  return "other";
}

/* převod pokroku z první verze appky na nový slovníček */
function migrate(st){
  let changed = false;
  Object.keys(st.cards).forEach(k => {
    if (/^u\d+l\d+i\d+$/.test(k)) {
      const n = LEGACY[k];
      if (n && !st.cards[n]) st.cards[n] = st.cards[k];
      delete st.cards[k]; changed = true;
    }
  });
  if (st.v < 2) { st.v = 2; changed = true; }
  return changed;
}
const local = lsRead(); if (local) { S = local; if (migrate(S)) lsWrite(); }

try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
})();
